name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm --dir packages/svbase exec playwright install chromium --with-deps

      - name: Library gates
        run: |
          pnpm --dir packages/svbase check
          pnpm --dir packages/svbase format
          pnpm --dir packages/svbase lint
          pnpm --dir packages/svbase test
          pnpm --dir packages/svbase prepack

      - name: Docs gates
        run: |
          pnpm --dir docs check
          pnpm --dir docs format
          pnpm --dir docs lint
          pnpm --dir docs build
